spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/menu-app?serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mvc:
    servlet:
      load-on-startup: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  servlet:
    context-path: /api

app:
  security:
    user-code: ${APP_USER_CODE}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://menu-app.kaminski.lu}

logging:
  level:
    lu.perso.menuback: INFO
    org.springframework.data: WARN
